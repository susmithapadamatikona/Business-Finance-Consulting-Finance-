<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Stackly</title>
  <link rel="preload" as="image" href="assets/login-office.jpg">
  <link rel="stylesheet" href="login.css?v=20261030-social-links">
  <link rel="stylesheet" href="auth-logo.css">
<link rel="stylesheet" href="brand-logo.css?v=20261030"></head>
<body>
  <main class="login-layout">
    <aside class="login-photo" aria-hidden="true"></aside>
    <section class="login-panel" aria-labelledby="login-title">
      <header><a class="auth-logo" href="index.html" aria-label="Stackly home"><img src="assets/stackly-whitish_blue-logo.webp" alt="Stackly" width="320" height="132"></a><h1 id="login-title">Welcome Back!</h1><p>Sign in to continue your Business Finance</p></header>
      <form id="login-form">
        <div class="field"><label for="identity">Email Address or Mobile Number</label><div class="input-wrap"><span aria-hidden="true">✉️</span><input id="identity" name="identity" autocomplete="username" placeholder="Email address or Mobile number" required></div></div>
        <div class="field password-field"><label for="password">Password *</label><div class="input-wrap"><span aria-hidden="true">🔒</span><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required><button id="password-toggle" type="button" aria-label="Show password" aria-pressed="false">👁️</button></div></div>
        <div class="login-options"><label><input type="checkbox" name="remember">Remember me</label><button type="button" class="text-link" data-action="Forgot password?">Forgot password?</button></div>
        <fieldset class="roles"><legend>Select Role:</legend><div class="role-options"><label><input type="radio" name="role" value="owner" checked><span>Owner</span></label><label><input type="radio" name="role" value="client"><span>Client</span></label><label><input type="radio" name="role" value="other"><span>📦 Other</span></label></div></fieldset>
        <button class="signin-button" type="submit">Sign In ➜</button>
        <div class="divider"><span>OR</span></div>
        <div class="social-options"><a href="404.html"><span class="provider-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.6 12.23c0-.71-.06-1.39-.18-2.05H12v3.88h5.38a4.6 4.6 0 0 1-1.99 3.02v2.51h3.22c1.89-1.74 2.99-4.3 2.99-7.36Z"/><path fill="#34A853" d="M12 22c2.7 0 4.96-.9 6.61-2.41l-3.22-2.51c-.9.6-2.04.96-3.39.96-2.6 0-4.81-1.76-5.6-4.13H3.08v2.59A10 10 0 0 0 12 22Z"/><path fill="#FBBC05" d="M6.4 13.91a6 6 0 0 1 0-3.82V7.5H3.08a10 10 0 0 0 0 9l3.32-2.59Z"/><path fill="#EA4335" d="M12 5.96c1.47 0 2.79.51 3.83 1.51l2.87-2.87A9.6 9.6 0 0 0 12 2a10 10 0 0 0-8.92 5.5l3.32 2.59C7.19 7.72 9.4 5.96 12 5.96Z"/></svg></span>Continue with Google</a><a href="404.html"><span class="provider-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#1877F2"/><path fill="#fff" d="M13.6 22.9v-8.2h2.8l.42-3.2H13.6V9.45c0-.92.26-1.55 1.6-1.55h1.72V5.04a23 23 0 0 0-2.5-.13c-2.48 0-4.18 1.5-4.18 4.28v2.31H7.45v3.2h2.79v8.16c1.1.17 2.23.18 3.36.04Z"/></svg></span>Continue with Facebook</a><a href="404.html"><span class="provider-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M17.1 12.5c0-2.2 1.8-3.3 1.9-3.4-1-1.5-2.6-1.7-3.2-1.8-1.3-.1-2.5.8-3.2.8-.7 0-1.7-.8-2.8-.8-1.5 0-2.9.9-3.7 2.2-1.6 2.7-.4 6.8 1.1 9 .7 1.1 1.6 2.3 2.8 2.2 1.1 0 1.5-.7 2.9-.7 1.3 0 1.7.7 2.9.7 1.2 0 2-1.1 2.7-2.2.9-1.3 1.3-2.6 1.3-2.7-.1 0-2.7-1-2.7-3.3ZM15 5.9c.6-.8 1.1-1.9 1-2.9-1 .1-2.1.7-2.8 1.4-.6.7-1.2 1.8-1.1 2.9 1.1.1 2.2-.6 2.9-1.4Z"/></svg></span>Continue with Apple</a></div>
        <p class="signup-link">Don't have an account? <a href="signup.html">Sign Up ➜</a></p>
        <p id="login-status" role="status" hidden></p>
      </form>
    </section>
  </main>
  <dialog id="login-info" aria-labelledby="info-title"><h2 id="info-title"></h2><p id="info-message"></p><button type="button" id="close-info">Close</button></dialog>
  <script src="login.js?v=20261030-account"></script>
</body>
</html>
